services:
  # --- Open WebUI: The Dashboard ---
  open-webui:
    # Stock upstream image, deliberately UNPINNED and re-pulled every run so the
    # stack always tracks the latest :main. Never build a patched image here: the
    # one attempt (62adf79, deleted) layered an anchored byte-exact substitution
    # onto middleware.py and exited nonzero on mismatch, which broke bring-up for
    # days -- and a moving base image can never satisfy such an anchor anyway.
    # Post-response task-model latency is fixed on interfaces we own instead
    # (openwebui-init/init.py task-model routing), not in OWUI's source.
    image: ghcr.io/open-webui/open-webui:main
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      # This mounts the 'open-webui-data' folder on your Mac to the container
      - ./open-webui-data:/app/backend/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - 'OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1'
      - 'OPENAI_API_KEY=not-needed'
      # First-boot defaults only; openwebui-init/init.py pushes the live values
      # through the API on every run. Concurrency is 1 because simultaneous
      # queries are what trip engine rate limits -- the fan-out across the
      # engine pool already happens inside SearXNG for each single query.
      - 'RAG_WEB_SEARCH_RESULT_COUNT=10'
      - 'RAG_WEB_SEARCH_CONCURRENT_REQUESTS=1'
      - 'ENABLE_EVALUATION_ARENA_MODELS=false'
      - 'WEBUI_ADMIN_EMAIL=${OWUI_ADMIN_EMAIL}'
      - 'WEBUI_ADMIN_PASSWORD=${OWUI_ADMIN_PASSWORD}'
      - 'WEBUI_ADMIN_NAME=Admin'
      - HF_TOKEN
      - 'HF_HOME=/root/.cache/huggingface'
      - 'SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface'
    extra_hosts:
      # Allows the container to talk to the mlx-serve / mlx_vlm servers on the Mac host
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 1s
      timeout: 1s
      retries: 1200
    depends_on:
      - searxng

  open-webui-init:
    build: .
    image: open-webui-init:latest
    pull_policy: if_not_present
    restart: no
    environment:
      - 'OWUI_URL=http://open-webui:8080'
      - OWUI_ADMIN_EMAIL
      - OWUI_ADMIN_PASSWORD
      - TASK_MODEL
      - TASK_MODEL_PORT
      # The RAG embedding model, co-hosted by the task-model server on
      # TASK_MODEL_PORT. init.py points OWUI's embedding engine at it, so RAG
      # never downloads a model inside the container (fatal offline, and behind
      # TLS inspection). Exported by runserver.sh; unset under a bare
      # `docker compose up`, where init.py leaves OWUI's default alone.
      - EMBEDDING_MODEL
      # Needed so init.py can mark the main router's connection 'local' --
      # OWUI's get_task_model_id routes task calls to the CHAT model unless it is.
      - MAIN_MODEL_PORT
      # Web-search provider (see init.py apply_web_search_config). Unset = the
      # qualified SearXNG sidecar. OWUI_WEB_SEARCH_ENGINE=duckduckgo switches to
      # in-container DDGS, which needs no sidecar but did not survive burst
      # traffic; OWUI_DDGS_BACKEND only applies in that mode.
      - OWUI_WEB_SEARCH_ENGINE
      - OWUI_DDGS_BACKEND
    depends_on:
      open-webui:
        condition: service_healthy
    volumes:
      - ./openwebui-init:/app

  # --- SearXNG: The Private Search Engine ---
  # THE SHIPPED WEB-SEARCH BACKEND (2026-09-16). The DDGS-inside-OWUI default
  # trialled on 2026-09-15 was reverted: DDGS managed 1/8 on the burst test,
  # and the plain duckduckgo scrape path CAPTCHAs on every query. This sidecar
  # pools three qualified engines and scored 25/25 sequential + 8/8 burst.
  # Evidence: docs/websearch-searxng-qualification-2026-09-16.md.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      # LOOPBACK ONLY. A SearXNG instance reachable off-box is an open,
      # unauthenticated search proxy that anyone on the network can drive,
      # which also burns our engines' rate-limit budget. Open WebUI does not
      # use this mapping at all -- it reaches the container as http://searxng:8080
      # over the compose network. This is published purely so an operator can
      # open /stats and /config while debugging.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.generated.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      # FORWARDED_ALLOW_IPS is deliberately unset. It tells the ASGI server to
      # trust client-supplied X-Forwarded-For, and "*" lets any caller forge
      # the source address the bot limiter keys on. There is no reverse proxy
      # in front of this service, so nothing needs it.
