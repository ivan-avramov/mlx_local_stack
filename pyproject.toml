[project]
name = "mlx-local-stack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub",
  "mlx-lm",
  "mlx-vlm",
  "mlx-serve",
]

[tool.uv]
package = false
# P267: never a macOS framework Python (re-execs on spawn; breaks process-identity checks).
python-preference = "only-managed"

[tool.uv.sources]
mlx-vlm = { path = "./src/mlx-vlm", editable = true }
mlx-serve = { path = "./src/mlx-serve", editable = true }
