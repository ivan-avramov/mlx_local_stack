    hf_path: mlx-community/gemma-4-26b-a4b-it-4bit
    max_kv_cache_size: 262144
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    # draft_kind: suffix       # drafter-free suffix decoding (see gemma-4-31b-it-6bit)
    # draft_block_size: 16
    # suffix_min_match: 2
    # draft_cooldown: 2

  # Qwen3.6-27B quant ladder for the 256K quality bake-off (added 2026-06-16).
  - name: Qwen3.6-27B-MLX-8bit
    type: vision
    on_demand: true
    hf_path: unsloth/Qwen3.6-27B-MLX-8bit
    max_kv_cache_size: 262144
    kv_quant_scheme: turboquant   # was uniform (2026-06-19): TQ is the validated Qwen KV path (full-attn layers); GDN layers have no KV. uniform-vs-TQ kept as a Phase-2 OFAT knob.
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    # draft_kind: suffix       # drafter-free suffix decoding (v1.1 GDN-aware)
    # draft_block_size: 16
    # suffix_min_match: 2
    # draft_cooldown: 2

  - name: Qwen3.6-27B-OptiQ-4bit
    type: vision
