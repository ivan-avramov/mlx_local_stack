mlx_port: 8091                    # Internal port used by the active mlx subprocess
manager_port: 8000                # Port the FastAPI manager listens on
inactivity_timeout_seconds: 10800   # Unload model after x seconds of no requests
startup_timeout_seconds: 300      # Max wait for model to become READY

# Notes:
# - kv_quant_scheme=uniform + integer kv_bits => standard QuantizedKVCache (TurboQuant
#   is NOT engaged; it only activates for scheme=turboquant or fractional kv_bits).
# - cache_limit_gb / memory_limit_frac are NOT set here on purpose: the MLX Metal
#   buffer-pool cap is auto-derived per model at startup from heads x prefill_step x
#   max_kv_cache_size (see mlx-vlm server cli), and the total-memory backstop adapts to
#   each machine's RAM. Set cache_limit_gb explicitly only to override the derivation.
# - reasoning_parser / tool_call_parser intentionally omitted: process_manager does not
#   forward them for type=vision models, and mlx-vlm auto-infers the tool parser.

models:
  - name: gemma-4-26b-a4b-it-8bit
    type: vision
    on_demand: true
    hf_path: mlx-community/gemma-4-26b-a4b-it-8bit
    max_kv_cache_size: 262144
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    # Drafter-free suffix decoding (see gemma-4-31b-it-6bit for notes). gemma4
    # MoE is still standard-attention, so suffix verify/rollback works.
    draft_kind: suffix
    draft_block_size: 16
    suffix_min_match: 2
    draft_cooldown: 2

  - name: gemma-4-31b-it-6bit
    type: vision
    on_demand: true
    hf_path: mlx-community/gemma-4-31b-it-6bit
    max_kv_cache_size: 262144
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    # Drafter-free n-gram / prompt-lookup speculative decoding (mlx-vlm fork).
    # Dense gemma4 is a v1 target. Big win on echo-heavy coding/reasoning,
    # graceful on novel prose. draft_cooldown pauses proposing after N
    # consecutive 0-accept rounds so novel text never regresses. Omit
    # draft_kind to disable; omit draft_cooldown for no cooldown.
    draft_kind: suffix
    draft_block_size: 16   # max draft (proposal) length
    suffix_min_match: 2    # minimum n-gram match length
    draft_cooldown: 2      # pause after 2 consecutive 0-accept rounds

  - name: gemma-4-31b-it-UD-MLX-4bit
    type: vision
    on_demand: true
    hf_path: unsloth/gemma-4-31b-it-UD-MLX-4bit
    max_kv_cache_size: 262144
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    draft_kind: suffix       # drafter-free suffix decoding (see gemma-4-31b-it-6bit)
    draft_block_size: 16
    suffix_min_match: 2
    draft_cooldown: 2

  # Suffix decoding IS enabled on Qwen3.6 as of v1.1: the verify forward now
  # captures the GatedDeltaNet recurrent state (capture_layer_ids=[]) so rejected
  # drafts roll back correctly, including under quantized (turboquant) KV.
  # See sketches/suffix-decoding-plan.md §8. Requires the v1.1 fix in src/mlx-vlm.
  - name: Qwen3.6-27B-UD-MLX-6bit
    type: vision
    on_demand: true
    hf_path: unsloth/Qwen3.6-27B-UD-MLX-6bit
    max_kv_cache_size: 262144
    kv_quant_scheme: turboquant
    kv_bits: 3
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    draft_kind: suffix       # drafter-free suffix decoding (v1.1 GDN-aware)
    draft_block_size: 16
    suffix_min_match: 2
    draft_cooldown: 2

  # QAT / optimized-quant experiments (quality-vs-size; QAT/OptiQ earn their keep at 4-6 bit).
  - name: gemma-4-31B-it-qat-6bit
    type: vision
    on_demand: true
    hf_path: mlx-community/gemma-4-31B-it-qat-6bit
    max_kv_cache_size: 196608      # 192K: weights ~31GB make 256K (~58GB) trip the RAM backstop
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    draft_kind: suffix       # drafter-free suffix decoding (see gemma-4-31b-it-6bit)
    draft_block_size: 16
    suffix_min_match: 2
    draft_cooldown: 2

  - name: gemma-4-26B-A4B-it-OptiQ-4bit
    type: vision
    on_demand: true
    hf_path: mlx-community/gemma-4-26B-A4B-it-OptiQ-4bit
    max_kv_cache_size: 262144
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    draft_kind: suffix       # drafter-free suffix decoding (see gemma-4-31b-it-6bit)
    draft_block_size: 16
    suffix_min_match: 2
    draft_cooldown: 2

  - name: gemma-4-26B-A4B-it-QAT-MLX-4bit
    type: vision
    on_demand: true
    hf_path: lmstudio-community/gemma-4-26B-A4B-it-QAT-MLX-4bit
    max_kv_cache_size: 262144
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    draft_kind: suffix       # drafter-free suffix decoding (see gemma-4-31b-it-6bit)
    draft_block_size: 16
    suffix_min_match: 2
    draft_cooldown: 2

  # Qwen3.6-27B quant ladder for the 256K quality bake-off (added 2026-06-16).
  - name: Qwen3.6-27B-MLX-8bit
    type: vision
    on_demand: true
    hf_path: unsloth/Qwen3.6-27B-MLX-8bit
    max_kv_cache_size: 262144
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    draft_kind: suffix       # drafter-free suffix decoding (v1.1 GDN-aware)
    draft_block_size: 16
    suffix_min_match: 2
    draft_cooldown: 2

  - name: Qwen3.6-27B-OptiQ-4bit
    type: vision
    on_demand: true
    hf_path: mlx-community/Qwen3.6-27B-OptiQ-4bit
    max_kv_cache_size: 262144
    kv_quant_scheme: uniform
    kv_bits: 4
    prefill_step_size: 512
    quantized_kv_start: 0
    enable_thinking: true
    draft_kind: suffix       # drafter-free suffix decoding (v1.1 GDN-aware)
    draft_block_size: 16
    suffix_min_match: 2
    draft_cooldown: 2
