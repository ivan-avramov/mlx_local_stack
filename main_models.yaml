  - name: Qwen3.8-27B-Fable-Distill-mlx-uniform-4bit
    type: vision
    on_demand: true
    hf_path: caslca/Qwen3.8-27B-Fable-Distill-mlx-uniform-4bit  # UPLOADED 2026-08-23 (public); this box overrides with a local workdir path to avoid a 15G re-download
