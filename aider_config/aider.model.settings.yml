# Weak model: route to the standalone task server on :8092 (NOT mlx-serve :8000),
# so it never swaps out the loaded primary.
- name: openai/mlx-community/Qwen2.5-1.5B-Instruct-4bit
  edit_format: whole
  use_repo_map: false
  streaming: true
  extra_params:
    api_base: http://localhost:8092/v1
    api_key: not-needed

# Cloud fallback — Opus via the Anthropic API. Needs ANTHROPIC_API_KEY in your
# environment (or .env). Not on mlx-serve, so switching to it never evicts a
# local model. litellm already knows this model's capabilities/costs, so it
# needs no metadata entry — only this behavior entry.
- name: anthropic/claude-opus-4-8
  edit_format: diff
  weak_model_name: openai/mlx-community/Qwen2.5-1.5B-Instruct-4bit
  use_repo_map: true
  streaming: true

# ─── SERVED-NAME entries (current mlx-serve registry names) for the agentic bake-off ───
# The alias entries above predate the current registry names. These carry the FULL tuned
# params from bench/model_params.py (the metadata JSON's extra_params is IGNORED by aider —
# see README "Why two model files"), so aider sends our production sampling + thinking, not
# defaults. Non-OpenAI knobs (top_k/repetition_penalty/enable_thinking/thinking_budget) go in
# extra_body so litellm forwards them verbatim. gemma family = production sampling (temp 0.7).
- name: openai/gemma-4-31b-it-6bit
  edit_format: whole
  use_repo_map: true
  streaming: true
  extra_params:
    max_tokens: 32768
    timeout: 3600          # litellm request timeout — local gen is slow (~20min/req); default 600s caused a timeout-retry loop
    temperature: 0.7
    top_p: 0.95
    extra_body:
      top_k: 64
      repetition_penalty: 1.08
      enable_thinking: true
      thinking_budget: 16384

- name: openai/gemma-4-26B-A4B-it-OptiQ-4bit
  edit_format: whole
  use_repo_map: true
  streaming: true
  extra_params:
    max_tokens: 32768
    timeout: 3600          # litellm request timeout — local gen is slow (~20min/req); default 600s caused a timeout-retry loop
    temperature: 0.7
    top_p: 0.95
    extra_body:
      top_k: 64
      repetition_penalty: 1.08
      enable_thinking: true
      thinking_budget: 16384

