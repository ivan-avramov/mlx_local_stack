# aider model settings for the mlx_local_stack
#   mlx-serve (multi-model server) ......... http://localhost:8000/v1
#   task model (always-on, standalone) ..... http://localhost:8092/v1
#
# Install: copy to ~/.aider.model.settings.yml  (note the leading dot).
# See README.md in this folder.
#
# edit_format: "diff" is the default here. If a model misapplies edits
# (you'll see "failed to apply edit"), switch that model to:
#   whole        -> rewrites whole files; most reliable on smaller local models
#   diff-fenced  -> alternate diff style some models parse better
#
# editor_model_name is intentionally UNSET. In architect mode aider then uses
# the main model as the editor, so a single `/model X` switch moves the
# architect AND editor roles together. (weak_model_name stays pinned — `/model`
# does not change it.)
#
# weak_model_name is pinned to the always-on task model on :8092 so commit
# messages / chat summaries never evict the primary from mlx-serve's single
# GPU slot. The task model's own entry (bottom) routes it to :8092 via
# extra_params.api_base.

- name: openai/Qwen3.6-27B-UD-MLX-6bit
  edit_format: diff
  weak_model_name: openai/mlx-community/Qwen2.5-1.5B-Instruct-4bit
  use_repo_map: true
  streaming: true
  extra_params:
    # max_tokens MUST be sent explicitly: aider treats max_output_tokens as an
    # informational cap and does NOT put it on the wire, so mlx-serve falls back
    # to its 2048 default and Qwen's thinking gets truncated mid-thought.
    max_tokens: 81920
    # Qwen3.6 is a thinking model. These pass straight through to mlx_vlm
    # (same knobs the OpenWebUI thinking filter uses). thinking_budget caps
    # the think phase so it leaves room to emit the diff within max_output.
    enable_thinking: true
    thinking_budget: 49152

- name: openai/gemma-4-31b-6-128
  edit_format: diff
  weak_model_name: openai/mlx-community/Qwen2.5-1.5B-Instruct-4bit
  use_repo_map: true
  streaming: true
  extra_params:
    # Send max_tokens explicitly (see Qwen3.6 note) — else mlx-serve caps at 2048.
    max_tokens: 32768
    # Thinking is OFF by default on mlx-serve (DEFAULT_ENABLE_THINKING=False) for
    # every model, so request it explicitly. thinking_budget caps the think phase
    # (leaving ~16k of the 32768 output for the diff).
    enable_thinking: true
    thinking_budget: 16384

