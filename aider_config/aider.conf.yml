# aider global config for the mlx_local_stack
# Install: copy to ~/.aider.conf.yml  (note the leading dot). See README.md.

# Default model — Qwen3.6 (thinking) on mlx-serve. Switch at runtime with
# /model <name>, e.g. /model openai/gemma-4-31b-6-128 or /model anthropic/claude-opus-4-8
model: openai/Qwen3.6-27B-UD-MLX-6bit

# mlx-serve OpenAI-compatible endpoint (the multi-model server on :8000).
openai-api-base: http://localhost:8000/v1
openai-api-key: not-needed

# Architect mode is OFF by default — it runs two generations per turn (architect
# pass + editor pass). Turn it on per-session with /architect, or uncomment to
# make it the default. With editor_model_name unset (see settings file), the
# main model fills both roles, so /model switches them together.
# architect: true
